<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RolêCerto 🎯</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN para compilar JSX direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Ícones em SVG inline para garantia de funcionamento offline/direto
    const SunIcon = () => (
      <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    );

    const DollarIcon = () => (
      <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    );

    const SmileIcon = () => (
      <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    );

    const SparklesIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    const ShareIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    );

    function RoleCertoApp() {
      const [budget, setBudget] = useState(50);
      const [mood, setMood] = useState('zen');
      const [loading, setLoading] = useState(false);
      const [itinerary, setItinerary] = useState(null);

      const database = {
        zen: [
          { name: "Passeio pelo Parque Central", cost: 0, time: "10:00", desc: "Caminhada ao ar livre e leitura na sombra das árvores." },
          { name: "Café e Leitura na Livraria Local", cost: 25, time: "14:30", desc: "Um café especial acompanhado de um bom livro." },
          { name: "Pôr do Sol no Mirante", cost: 0, time: "17:30", desc: "Apreciação da vista da cidade no fim de tarde." }
        ],
        energia: [
          { name: "Aluguel de Bike na Orla/Ciclovia", cost: 15, time: "09:00", desc: "Pedalada energética para começar o dia." },
          { name: "Almoço em Feira Gastronômica", cost: 35, time: "12:30", desc: "Opções variadas de street food com música ao vivo." },
          { name: "Partida de Boliche com Amigos", cost: 45, time: "16:00", desc: "Diversão e competição amigável." }
        ],
        cultural: [
          { name: "Visita ao Museu de Arte", cost: 10, time: "10:30", desc: "Exposições de arte moderna e fotografia." },
          { name: "Almoço em Bistrô Histórico", cost: 40, time: "13:00", desc: "Culinária local em um ambiente tradicional." },
          { name: "Sessão no Cinema de Rua", cost: 20, time: "16:30", desc: "Filme cult ou independente com pipoca." }
        ],
        gourmet: [
          { name: "Tour pelo Mercado Municipal", cost: 0, time: "11:00", desc: "Degustação de queijos, frutas e iguarias locais." },
          { name: "Almoço Executivo de Chef", cost: 60, time: "13:00", desc: "Menu de dois tempos em restaurante renomado." },
          { name: "Sorvete Artesanal / Gelato", cost: 20, time: "16:00", desc: "Sobremesa para finalizar o passeio com chave de ouro." }
        ]
      };

      const generateItinerary = () => {
        setLoading(true);
        setItinerary(null);

        setTimeout(() => {
          const selectedPool = database[mood] || database.zen;
          let total = 0;
          const filteredEvents = selectedPool.filter(item => {
            if (total + item.cost <= budget || item.cost === 0) {
              total += item.cost;
              return true;
            }
            return false;
          });

          setItinerary({
            title: `Rolê ${mood.toUpperCase()} Perfeito`,
            totalCost: total,
            events: filteredEvents.length > 0 ? filteredEvents : selectedPool.slice(0, 1)
          });

          setLoading(false);
        }, 600);
      };

      const getWhatsAppLink = () => {
        if (!itinerary) return '#';
        let text = `🚀 *Meu Roteiro do Dia (RolêCerto)*\n\n`;
        itinerary.events.forEach(e => {
          text += `📍 *${e.time}* - ${e.name} (R$ ${e.cost})\n`;
        });
        text += `\n💰 *Gasto Total Estimado:* R$ ${itinerary.totalCost},00`;
        return `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center p-4 md:p-8 font-sans">
          
          {/* Cabeçalho */}
          <header className="w-full max-w-xl text-center mb-8">
            <div className="inline-flex items-center gap-2 bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-full text-xs font-medium text-amber-400 mb-4">
              <SunIcon />
              <span>São Paulo, SP • 24°C Ensolarado</span>
            </div>
            <h1 className="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
              RolêCerto 🎯
            </h1>
            <p className="text-slate-400 text-sm mt-2">
              Descubra o que fazer hoje sem estourar o orçamento.
            </p>
          </header>

          {/* Card Principal */}
          <main className="w-full max-w-xl bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl backdrop-blur-sm space-y-6">
            
            {/* Controle do Orçamento */}
            <div>
              <div className="flex justify-between items-center mb-2">
                <label className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                  <DollarIcon /> Orçamento Máximo:
                </label>
                <span className="text-lg font-bold text-emerald-400">R$ {budget},00</span>
              </div>
              <input 
                type="range" 
                min="0" 
                max="200" 
                step="10" 
                value={budget} 
                onChange={(e) => setBudget(Number(e.target.value))}
                className="w-full accent-amber-500 bg-slate-700 rounded-lg h-2 cursor-pointer"
              />
              <div className="flex justify-between text-xs text-slate-500 mt-1">
                <span>R$ 0 (Grátis)</span>
                <span>R$ 100</span>
                <span>R$ 200+</span>
              </div>
            </div>

            {/* Seleção do Humor */}
            <div>
              <label className="text-sm font-semibold text-slate-300 flex items-center gap-2 mb-3">
                <SmileIcon /> Qual é a vibe de hoje?
              </label>
              <div className="grid grid-cols-2 gap-2">
                {[
                  { id: 'zen', label: '🧘 Zen / Calmo' },
                  { id: 'energia', label: '⚡ Energia Alta' },
                  { id: 'cultural', label: '🎨 Cultural' },
                  { id: 'gourmet', label: '🍕 Gastronômico' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setMood(item.id)}
                    className={`p-3 rounded-xl border text-sm font-medium transition-all text-left ${
                      mood === item.id 
                        ? 'bg-amber-500/10 border-amber-500 text-amber-400' 
                        : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:border-slate-600'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Botão de Ação */}
            <button
              onClick={generateItinerary}
              disabled={loading}
              className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer"
            >
              {loading ? (
                <span className="animate-pulse">Criando roteiro...</span>
              ) : (
                <>
                  <SparklesIcon /> Gerar Meu Roteiro
                </>
              )}
            </button>

          </main>

          {/* Exibição do Roteiro */}
          {itinerary && (
            <section className="w-full max-w-xl mt-6 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl animate-fade-in">
              <div className="flex justify-between items-start mb-4 border-b border-slate-700 pb-4">
                <div>
                  <h2 className="text-xl font-bold text-amber-400">{itinerary.title}</h2>
                  <p className="text-xs text-slate-400">Sugestões personalizadas para o seu dia</p>
                </div>
                <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1 rounded-full font-bold">
                  Total: R$ {itinerary.totalCost},00
                </span>
              </div>

              <div className="space-y-4 mb-6">
                {itinerary.events.map((event, idx) => (
                  <div key={idx} className="flex gap-4 items-start">
                    <span className="bg-slate-900 border border-slate-700 text-amber-400 text-xs font-mono px-2.5 py-1 rounded-md mt-0.5">
                      {event.time}
                    </span>
                    <div className="flex-1">
                      <div className="flex justify-between items-center">
                        <h3 className="font-semibold text-slate-200 text-sm">{event.name}</h3>
                        <span className="text-xs text-slate-400 font-medium">
                          {event.cost === 0 ? 'Grátis' : `R$ ${event.cost}`}
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-0.5">{event.desc}</p>
                    </div>
                  </div>
                ))}
              </div>

              <a
                href={getWhatsAppLink()}
                target="_blank"
                rel="noopener noreferrer"
                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl transition-all text-xs flex items-center justify-center gap-2"
              >
                <ShareIcon /> Enviar Roteiro no WhatsApp
              </a>
            </section>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RoleCertoApp />);
  </script>
</body>
</html>
